<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data delivery · controls</title>
<style>
body{font:15px/1.65 'Segoe UI','Microsoft YaHei',sans-serif;color:#30454d;background:#f5f7f7;max-width:800px;margin:42px auto;padding:0 24px}h1{font-size:22px;margin-bottom:4px}a{color:#176d66}section{margin-top:22px;padding:20px 24px;border:1px solid #d9e3e4;border-radius:8px;background:white}label{display:block;margin-bottom:14px}input,textarea,select,button{font:inherit;border:1px solid #cbd9dc;border-radius:5px;padding:7px 10px;color:inherit;background:#fff}textarea{display:block;width:calc(100% - 22px);min-height:70px;margin-top:6px}button{cursor:pointer;margin:4px 6px 4px 0}button:hover{background:#eaf4f1}button.primary{background:#197d6d;color:white}#status{white-space:pre-wrap;margin:0}#message{color:#97551f;min-height:24px}small{color:#6f8289}input{width:130px}select{margin-left:10px}
</style>
<h1>Data delivery</h1><a data-bo-entry href="/" target="_blank" rel="noopener">Inspect application state and code ↗</a>
<section>
  <label for="content">Content to check</label><textarea id="content"></textarea>
  <label for="capacity">Maximum concurrent checks in this run<select id="capacity"><option value="1">1 check</option><option value="2">2 checks</option></select></label>
  <button id="edit">Save content and capacity</button><small>Saving creates a new parameter version requiring authorization.</small>
</section>
<section>
  <label for="grant">Authorization ID <input id="grant" value="G1"></label>
  <button id="approve">Approve current version</button><button id="revoke">Revoke this authorization</button>
  <div><button id="prepare">Check only</button><button id="execute" class="primary">Check and commit</button><button id="commit">Commit checked result</button><button id="cancel">Cancel delivery</button></div>
  <div id="message" role="status"></div><pre id="status">Reading application state.</pre>
</section>
<script>
const $=id=>document.getElementById(id);
const phases={draft:'Ready for checks',waiting:'Waiting for authorization',checking:'Checking',ready:'Ready to commit',failed:'Checks failed',cancelled:'Cancelled',completed:'Delivered'};
const states={pending:'Not started',waiting:'Waiting for capacity',running:'Running',succeeded:'Passed',rejected:'Rejected',failed:'Failed',cancelled:'Cancelled'};
const reasons={no_current_authorization:'No valid authorization covers this parameter version.',check_rejected:'Not all checks passed.',authorization_or_version_changed:'Authorization or parameter version changed; repeat checks.',process_restarted:'Process restarted; previous checks were interrupted.'};
let latest,initial=true;
async function send(action,values={}){
  $('message').textContent='';
  try{const response=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...values})});const value=await response.json();if(!response.ok)throw Error(value.error==='busy'?'A check is already running.':value.error);await refresh();}
  catch(e){$('message').textContent='Operation not completed: '+e.message;}
}
$('edit').onclick=()=>send('edit',{content:$('content').value,capacity:Number($('capacity').value)});
$('approve').onclick=()=>send('grant',{id:$('grant').value,expires:latest.clock+100});
$('revoke').onclick=()=>send('revoke',{id:$('grant').value});
for(const action of ['prepare','execute','commit','cancel'])$(action).onclick=()=>send(action);
async function refresh(){
  const response=await fetch('/api/app-state');latest=await response.json();
  if(initial){$('content').value=latest.content;$('capacity').value=String(latest.capacity);initial=false;}
  const execution=latest.execution||{},resource=execution.resources?.workers;
  const interrupted=latest.executions?.find(r=>r.attempt===latest.attempt)?.disposition==='interrupted';
  const stateText=id=>(states[execution.activities?.[id]]||'Not started')+(interrupted?' (pre-interruption record)':'');
  const grants=latest.grants.filter(g=>g.version===latest.param_version).map(g=>g.id+'（'+(g.revoked?'Revoked':latest.clock>=g.expires?'Expired':'Valid')+'）');
  const lines=['Current state: '+phases[latest.state]+' · parameter version: '+latest.param_version,
    'Version authorization: '+(grants.join('、')||'none'),
    'Content digest: '+stateText('checksum'),
    'Sensitive marker check: '+stateText('privacy'),
    (interrupted?'Available slots before interruption: ':'Available slots in this run: ')+(resource?resource.available+' / '+resource.capacity:'Not allocated'),
    'Saved deliveries: '+latest.effects.length+''];
  if(latest.reason)lines.push(reasons[latest.reason]||(latest.reason.startsWith('worker_error:')?'Check function failed.':latest.reason));
  $('status').textContent=lines.join('\n');
}
async function poll(){try{await refresh();}catch(e){$('message').textContent='Cannot connect to the application.';}finally{setTimeout(poll,400);}}poll();
</script></html>
