<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发者运行图</title><link rel="stylesheet" href="/viewer.css"></head><body>
<header><div class="brand"><span class="mark">◉</span><h1 id="title">运行图</h1></div><div class="header-right"><span id="connection">连接中</span><a href="/control" target="_blank" rel="noopener">操作程序 ↗</a></div></header>
<div class="toolbar"><label>视图 <select id="analysis-view" aria-label="分析视图"></select></label><button id="analysis-details" aria-pressed="false" title="显示内部调用、资源和判定依赖">分析细节</button><button id="filter-toggle" disabled aria-expanded="false" aria-controls="filter-panel">筛选</button><div class="graph-search"><input id="node-search" type="search" aria-label="搜索节点" placeholder="搜索节点、参数、批注" autocomplete="off"><div id="search-results" aria-label="搜索结果" hidden></div></div></div>
<div class="record-bar"><select id="capture-mode" aria-label="记录范围"><option value="all">全部核心事件</option><option value="focused">仅选中区域</option></select><button id="record-start" disabled>● 开始记录</button><button id="record-stop" disabled>■ 结束记录</button><select id="record-list" aria-label="选择记录"><option value="">实时观察</option></select><span id="record-status" role="status"></span></div>
<section id="replay" hidden aria-label="记录回放"><div class="replay-controls"><button id="replay-prev" aria-label="上一步">‹</button><button id="replay-play">播放</button><button id="replay-next" aria-label="下一步">›</button><input id="replay-range" type="range" min="0" value="0" aria-label="回放步骤位置"><output id="replay-position"></output><select id="replay-grain" aria-label="播放粒度"><option value="view">按当前层级</option><option value="events">逐个原始事件</option></select><select id="replay-speed" aria-label="回放速度"><option value="1600">慢速</option><option value="900" selected>正常</option><option value="300">快速</option></select><button id="replay-live">返回实时</button></div><div class="replay-event-row"><select id="replay-events" aria-label="记录中的步骤"></select><button id="replay-locate">定位</button><button id="replay-export">导出</button><span id="replay-note"></span></div></section>
<div class="workspace"><aside class="view-tools" aria-label="画布与节点操作"><span class="rail-heading">画布</span><select id="layout" aria-label="布局算法"><option value="cluster">圆形分组</option><option value="layered">层次布局</option><option value="stress">关系布局</option></select><button id="arrange">自动布局</button><button id="undo-layout" disabled>撤销布局</button><button id="collapse">收起全部</button><button id="expand">展开一级</button><button id="fit">适应画布</button><div class="zoom-controls"><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button></div><output id="zoom">100%</output><span class="rail-heading">选中节点</span><button id="focus-selection" disabled>定位</button><button id="node-expand" disabled>展开</button><button id="pin" disabled>固定位置</button><button id="core-toggle" disabled>☆ 核心</button><button id="annotate" disabled>名称 / 批注</button><button id="details" disabled>参数值</button><button id="source" disabled>源码</button><button id="reference-origin" hidden>原节点</button><span id="layout-status" role="status"></span></aside>
<main id="viewport" tabindex="0" aria-label="统一节点连接图。拖动节点或圈内空白移动整组，拖动圈外空白平移；双击展开，滚轮缩放。选中节点后按 F 定位、P 固定，方向键移动；Esc 清除高亮。"><div id="canvas-host"></div><div id="semantic" class="accessible-graph"></div><div id="semantic-edges" class="accessible-graph" aria-label="当前层级的关系"></div><div id="empty" hidden></div><nav id="hierarchy-path" aria-label="所属层级"></nav>
<section id="filter-panel" hidden aria-label="图的筛选条件"><div class="detail-heading"><strong>显示内容</strong><button id="close-filters" aria-label="关闭筛选">×</button></div>
<fieldset><legend>节点</legend><div class="filter-bulk"><button data-filter-group="nodes" data-all="true">全选</button><button data-filter-group="nodes" data-all="false">清空</button></div><div id="filter-nodes" class="filter-options"></div></fieldset>
<fieldset><legend>连线</legend><div class="filter-bulk"><button data-filter-group="edges" data-all="true">全选</button><button data-filter-group="edges" data-all="false">清空</button></div><div id="filter-edges" class="filter-options"></div></fieldset>
<fieldset><legend>展开的圈</legend><div class="filter-bulk"><button data-filter-group="regions" data-all="true">全选</button><button data-filter-group="regions" data-all="false">清空</button></div><div id="filter-regions" class="filter-options"></div></fieldset>
<label class="filter-depth-label">范围 <select id="filter-scope"><option value="all">全部</option><option value="permission">权限相关</option><option value="execution">执行配置</option><option value="observed">已采集事件</option><option value="blocked">等待或未通过</option><option value="shared">共享成员</option></select></label>
<label class="filter-depth-label">包含文字 <input id="filter-query" maxlength="100" placeholder="名称、函数或参数"></label>
<label class="filter-depth-label">层级 <select id="filter-depth"><option value="all">全部层级</option></select></label><p id="filter-count" role="status"></p><button id="filter-reset">恢复本视图</button><form id="save-view"><input id="custom-view-name" maxlength="40" required placeholder="自定义视图名称" aria-label="自定义视图名称"><button type="submit">保存视图</button></form><button id="delete-view" hidden>删除此自定义视图</button></section>
<section id="edge-details" hidden aria-label="连线的原始关系"><div class="detail-heading"><strong id="edge-title"></strong><button id="close-edge" aria-label="关闭关系明细">×</button></div><ul id="edge-members"></ul></section>
<section id="node-details" hidden aria-label="节点旁的详细信息"><div class="detail-heading"><strong id="detail-title"></strong><button id="close-detail" aria-label="关闭详细信息">×</button></div><div id="detail-rows"></div><form id="annotation-form" hidden><label for="node-name">显示名称</label><input id="node-name" maxlength="80" autocomplete="off"><label for="node-note">批注</label><textarea id="node-note" maxlength="500" rows="4"></textarea><label class="core-label"><input id="node-core" type="checkbox">★ 标为核心节点</label><p class="subtle">名称与批注保存在项目的个人视图配置中。</p><div class="annotation-actions"><button id="restore-name" type="button">恢复原名</button><button type="submit">完成</button></div></form><button id="full-source" hidden>完整文件</button><pre id="source-code" hidden></pre></section><section id="step-changes" hidden aria-label="本步变化"><div class="change-heading"><strong id="change-title"></strong><span id="change-count"></span></div><div id="change-rows"></div></section></main>
<aside id="legend-panel" aria-label="图例"><span class="rail-heading">节点与区域</span><div id="legend-types"></div><p class="legend-note">展开的圈代表自身，颜色保持一致。</p><span class="rail-heading">连线</span><div class="legend relation-legend" aria-label="连线类型"></div><span class="rail-heading">节点标记</span><dl><dt>▶ 执行中　✓ 已完成</dt><dt>! 等待 / 未通过</dt><dt>· 历史事实</dt><dt>＋N 子节点　− 收起</dt><dt>● 固定　✎ 批注　★ 核心</dt><dt>↗ 同一节点的共享入口</dt></dl><p class="legend-note">圈内空白拖动整组；圈外空白移动画布。</p></aside></div>
<footer><span id="selection">双击展开；拖动节点或圈内空白移动整组。</span><span id="renderer">PixiJS</span></footer>
<div hidden aria-hidden="true"><select id="version"><option value="live">live</option></select><select id="case"><option value="live">live</option></select><select id="attempt"><option value="latest">latest</option></select><select id="step"><option value="latest">latest</option></select><span id="phase"></span><span id="context"></span><span id="binding"></span><button id="legend-toggle"></button><button id="legend-close"></button><div id="node-legend"></div><div class="graph-legends"></div></div>
<script src="/pixi.min.js"></script><script src="/elk.bundled.js"></script><script type="module" src="/viewer.js"></script></body></html>
