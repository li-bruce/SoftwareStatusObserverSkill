name: bo-db-vis
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bo_test
      POSTGRES_PASSWORD: bo_test_local_only
      POSTGRES_DB: bo_test
    ports: ["127.0.0.1:19432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bo_test -d bo_test"]
      interval: 2s
      timeout: 3s
      retries: 40
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:19017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:19379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 40
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/bo_test_local_only
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports: ["127.0.0.1:19687:7687"]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "bo_test_local_only", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 40
