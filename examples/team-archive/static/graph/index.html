<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发者运行图</title><link rel="stylesheet" href="/viewer.css"></head><body>
<header><div class="brand"><span class="mark">◉</span><h1 id="title">运行图</h1></div>
<div class="layout-tools"><label>布局 <select id="layout"><option value="layered">层次布局</option><option value="stress">关系布局</option></select></label><button id="arrange">自动布局</button><button id="undo-layout" disabled>撤销布局</button><span id="layout-status" role="status">视图自动保存</span></div>
<div class="header-right"><span id="connection">连接中</span><a href="/control" target="_blank" rel="noopener">操作台 ↗</a></div></header>
<div class="toolbar"><label>版本 <select id="version"><option value="live">当前程序</option></select></label><label>场景 <select id="case"><option value="normal">授权有效，完成交付</option></select></label><label>运行 <select id="attempt"><option value="latest">当前运行</option></select></label><label>时刻 <select id="step"><option value="latest">最新状态</option></select></label><span class="spacer"></span><button id="collapse">收起</button><button id="expand">展开一级</button><button id="fit">显示完整图</button><div class="zoom-controls"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom">100%</output><button id="zoom-in" aria-label="放大">＋</button></div></div>
<div class="facts"><strong id="phase">正在读取状态</strong><span id="context"></span><span class="spacer"></span><div class="graph-search"><input id="node-search" type="search" aria-label="搜索节点" placeholder="搜索名称、函数、参数或备注" autocomplete="off"><div id="search-results" aria-label="搜索结果" hidden></div></div><span id="binding"></span></div>
<main id="viewport" tabindex="0" aria-label="统一节点连接图。拖动节点调整位置，拖动空白平移；双击展开，滚轮缩放。选中节点后按 P 固定，方向键移动。"><div id="canvas-host"></div><div id="semantic" class="accessible-graph"></div><div id="empty" hidden></div>
<div class="legend" aria-label="节点类型"><span class="business">● 业务</span><span class="function">⬡ 函数</span><span class="state">◎ 状态</span><span class="decision">◆ 判断</span><span class="resource">▱ 资源</span><span class="data">◇ 参数</span></div>
<section id="node-details" hidden aria-label="节点旁的详细信息"><div class="detail-heading"><strong id="detail-title"></strong><button id="close-detail" aria-label="关闭详细信息">×</button></div><div id="detail-rows"></div><form id="annotation-form" hidden><label for="node-name">显示名称</label><input id="node-name" maxlength="80" autocomplete="off"><label for="node-note">备注</label><textarea id="node-note" maxlength="500" rows="4"></textarea><p class="subtle">自动保存在当前浏览器，不修改源码。</p><div class="annotation-actions"><button id="restore-name" type="button">恢复原名</button><button type="submit">完成</button></div></form><button id="full-source" hidden>完整文件</button><pre id="source-code" hidden></pre></section></main>
<footer><span id="selection">拖动节点调整布局；双击展开内部关系。</span><div class="node-actions"><button id="node-expand" disabled>展开</button><button id="pin" disabled>固定节点</button><button id="annotate" disabled>名称与备注</button><button id="details" disabled>详细值</button><button id="source" disabled>源码</button></div><span id="renderer">PixiJS</span></footer>
<script src="/pixi.min.js"></script><script src="/elk.bundled.js"></script><script type="module" src="/viewer.js"></script></body></html>
