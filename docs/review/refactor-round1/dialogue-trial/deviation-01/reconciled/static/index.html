<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打印工作室 · 执行图</title><link rel="stylesheet" href="/viewer.css"></head><body>
<header><div><span class="eyebrow">STUDIO / EXECUTION OBSERVER</span><h1>打印工作室</h1><p>从一次运行，看清检查、等待与机器占用。</p></div><div id="health" role="status"></div></header>
<section class="toolbar"><label>运行<select id="run"></select></label><label>记录<select id="record"><option value="live">当前运行</option></select></label><label>搜索<input id="search" placeholder="函数、状态或节点"></label><label>节点类型<select id="type"><option value="all">全部类型</option><option value="function">函数</option><option value="decision">判断</option><option value="state">状态</option><option value="data">参数与资源</option><option value="wait">等待</option></select></label><label>连接<select id="edge-type"><option value="all">全部连接</option><option value="flow">流程／静态调用</option><option value="guard">条件</option><option value="data">传值</option></select></label><label class="check"><input type="checkbox" id="analysis">分析细节</label><button id="overview">返回概览</button><button id="layout">重新排列</button></section>
<section class="playback"><button id="previous" aria-label="上一步">←</button><button id="play">播放</button><button id="next" aria-label="下一步">→</button><input id="timeline" aria-label="历史事务时刻" type="range" min="0" max="0" value="0"><span id="frame"></span><button id="live">最新</button></section>
<div id="status" class="status"></div><main><section class="graph-panel"><div class="legend"><span>蓝：动作／函数</span><span>琥珀：判断</span><span>灰蓝：状态／等待</span><span>● 有本次调用记录</span><span>虚线：声明或静态关系</span></div><div id="canvas-wrap"><svg id="graph" viewBox="0 0 1400 650" role="img" aria-label="只读运行关系图"></svg></div><p class="hint">点击查看实际值与源码；双击展开，拖动区域保留整组位置。图操作不执行打印命令。</p></section><aside><h2 id="detail-title">选择一个节点</h2><div id="detail"></div><div id="annotation" hidden><label>显示名称<input id="alias"></label><label>批注<textarea id="note" rows="2"></textarea></label><label class="check"><input id="core" type="checkbox">核心节点</label><button id="source-button">查看实际源码</button></div><pre id="source" hidden></pre></aside></main>
<footer><span id="save-status">个人视图已加载</span><div><button id="record-start">开始记录</button><button id="record-stop">结束并保存</button><span id="record-status"></span></div><span>本地模拟设备 · 已提交尺寸 · 不解析模型文件</span></footer><script type="module" src="/viewer.js"></script></body></html>
