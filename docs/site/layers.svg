<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">One graph, from business flow to source evidence</title><desc id="desc">Five connected views: business flow, state transitions, decision dependencies, anchored functions and parameters, and static source. Views may be combined.</desc>
