<rect width="1120" height="660" rx="18" fill="#f3f6fa"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172831"><text x="44" y="48" font-size="24" font-weight="600">One graph. Follow the evidence down.</text><text x="44" y="75" font-size="14" fill="#556774">Progressive views of one operation · an illustration, not a captured runtime trace</text>
<g font-size="17" font-weight="600"><text x="44" y="135">Business flow</text><text x="44" y="237">State + activity</text><text x="44" y="340">Decisions + rules</text><text x="44" y="444">Functions + values</text><text x="44" y="548">Static source</text></g>
